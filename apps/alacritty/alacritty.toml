# alacritty config

# theme
import = ["~/.config/alacritty/themes/pixiefloss.toml"]

# font
[font]
size = 13.0

[font.normal]
family = "DejaVu Sans Mono"
style = "Book"

[font.bold]
style = "Bold"

[font.italic]
style = "Oblique"

# window
[window]
padding = { x = 8, y = 8 }
opacity = 0.81
dynamic_title = true

# cursor
[cursor.style]
shape = "Block"
blinking = "On"

# scrolling
[scrolling]
history = 50000

# env
[env]
TERM = "xterm-256color"

# selection
[selection]
save_to_clipboard = true

# mouse
[[mouse.bindings]]
mouse = "Right"
action = "Paste"

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"
